[server]
port = 8080
production = false
jwt_secret = change_me_in_production
review_secret = change_me_too
# In production, set to the backend's public origin so upload URLs come back absolute
# (e.g. https://api.example.com/uploads/foo.jpg). Leave blank in dev — the Vite proxy
# forwards /uploads/* to the backend.
public_base_url =

[database]
host = localhost
port = 5432
user = postgres
password = postgres
database = wealthy_prime
ssl_mode = disable

[cors]
allowed_origins = http://localhost:5173,http://localhost:3000

# SMTP for outbound notifications (booking → assigned agent).
# Production sender is wealthyprime.admin@gmail.com. The Gmail App Password
# MUST be supplied via the SMTP_PASSWORD env var at deploy time — never
# commit it. Generate one at: Google Account → Security → 2-Step Verification
# → App Passwords (the account must have 2FA enabled).
[smtp]
host = smtp.gmail.com
port = 587
user = wealthyprime.admin@gmail.com
password =
from = wealthyprime.admin@gmail.com
from_name = Wealthy Prime Estate
# Base URL used in email links (points back to the agent dashboard).
app_url = http://localhost:5173
# Optional: BCC every appointment notification to this address (monitoring).
notification_bcc =
